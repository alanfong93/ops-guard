[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-guard"
version = "0.1.0"
description = "Single-operator MCP trust layer: cited runbook guidance, controlled execution, durable audit."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "jcs>=0.2.1",
    "local-judge @ git+https://github.com/alanfong93/local-judge@fca3fbde28312e7a1fa18940b8738ae406714f43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
