[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-guard"
version = "0.1.0"
description = "Single-operator MCP trust layer: cited runbook guidance, controlled execution, durable audit."
requires-python = ">=3.12"
dependencies = [
    "jcs>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
